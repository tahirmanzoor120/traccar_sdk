version: "3.8"

services:
  traccar:
    image: traccar/traccar:6
    container_name: traccar_test
    ports:
      - "8082:8082"
    volumes:
      - ./docker/traccar.xml:/opt/traccar/conf/traccar.xml:ro
      - traccar_data:/opt/traccar/data
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/api/server || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

volumes:
  traccar_data:
