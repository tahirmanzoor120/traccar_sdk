name: traccar_sdk
description: >-
  Typed Dart client for the Traccar GPS tracking server API with REST,
  WebSocket updates, and Basic, token, and cookie authentication.
version: 0.1.2
license: Apache-2.0
homepage: https://github.com/tahirmanzoor120/traccar_sdk
repository: https://github.com/tahirmanzoor120/traccar_sdk
issue_tracker: https://github.com/tahirmanzoor120/traccar_sdk/issues

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  dio: ^5.3.2
  json_annotation: ^4.11.0
  logging: ^1.3.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  build_runner: ^2.4.10
  http_mock_adapter: ^0.6.0
  json_serializable: ^6.8.0
  lints: ^6.0.0
  mocktail: ^1.0.0
  test: ^1.25.8
