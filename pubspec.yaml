name: traccar_api
description: >-
  A fully-typed Dart/Flutter client for the Traccar GPS tracking server REST
  API (v6). Supports Basic and Bearer-token authentication, all REST endpoints,
  real-time WebSocket updates, and structured disableable logging.
version: 0.1.0
homepage: https://gitlab.com/yourorg/traccar_api
repository: https://gitlab.com/yourorg/traccar_api
issue_tracker: https://gitlab.com/yourorg/traccar_api/-/issues

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  dio: ^5.0.0
  flutter:
    sdk: flutter
  json_annotation: ^4.9.0
  logging: ^1.2.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  build_runner: ^2.4.0
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  http_mock_adapter: ^0.6.0
  json_serializable: ^6.7.0
  mocktail: ^1.0.0
